name: 'Lint, Unit and E2E Tests'

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: yarn

      - name: Install SDK dependencies
        run: yarn install --frozen-lockfile

      - name: Check eslint rules
        run: yarn run lint-ci

      - name: Prettier
        run: npm run prettier-ci

      - name: Build SDK
        run: yarn run build

      - name: Run unit tests
        run: yarn run test
        env:
          RPC_MAINNET: ${{ secrets.RPC_MAINNET }}
          RPC_GNOSIS: ${{ secrets.RPC_GNOSIS }}
          RPC_SEPOLIA: ${{ secrets.RPC_SEPOLIA }}
          RPC_HOODI: ${{ secrets.RPC_HOODI }}

      - name: Install e2e dependencies
        working-directory: ./test/sdk-package
        run: yarn install --frozen-lockfile

      - name: Build e2e
        working-directory: ./test/sdk-package
        run: yarn run build

      - name: Clear Jest cache
        working-directory: ./test/sdk-package
        run: yarn jest --clearCache || true

      - name: Run e2e tests
        working-directory: ./test/sdk-package
        run: yarn run test:e2e
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          DEL_AUTH: ${{ secrets.DEL_AUTH }}
          RPC_HOODI: ${{ secrets.RPC_HOODI }}
          RPC_MAINNET: ${{ secrets.RPC_MAINNET }}
          RPC_GNOSIS: ${{ secrets.RPC_GNOSIS }}
          RPC_SEPOLIA: ${{ secrets.RPC_SEPOLIA }}
