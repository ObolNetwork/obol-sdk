name: 'Lint and Unit Tests'

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: yarn

      - name: Install SDK dependencies
        run: yarn install --frozen-lockfile

      - name: Check eslint rules
        run: yarn run lint-ci

      - name: Prettier
        run: npm run prettier-ci

      - name: Build SDK
        run: yarn run build

      # Fails on a public API change not reviewed into etc/obol-sdk.api.md
      # (run `yarn api:update` and commit the report).
      - name: API report
        run: yarn run api:check

      # Bundle sizes against scripts/bundle-budget.json; a reads-only ovm
      # import must not carry BLS or SSZ code.
      - name: Bundle size
        run: yarn run size:check

      - name: Run unit tests
        run: yarn run test
