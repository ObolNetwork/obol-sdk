# SonarCloud automatic analysis (no scanner in CI). Analyse the SDK and its
# tests; leave out generated files and the differential fuzz harness
# (test/fuzz: a dev-only tool with a Go oracle and shell drivers, run with
# `yarn test:fuzz`, not shipped).
sonar.sources=src,scripts
sonar.tests=test,test-e2e
sonar.exclusions=spec/schemas/**,etc/**,dist/**,docs/**
sonar.test.exclusions=test/fuzz/**,test/bytecodes.ts,test/fixtures/**,test/simulate/fixtures/**
# Recorded vectors and fixtures repeat by design.
sonar.cpd.exclusions=test/**,test-e2e/**,spec/**
# test-e2e has its own tsconfig; without it its types (viem's parseAbi results) go unresolved.
sonar.typescript.tsconfigPaths=tsconfig.json,test-e2e/tsconfig.json
